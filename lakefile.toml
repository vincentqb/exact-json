name = "tomljson"
version = "0.1.0"
defaultTargets = ["TomlJson", "tomljson"]
testDriver = "Tests"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.missingDocs = true

# The format and its Lean implementation: no dependency beyond Lean core.
[[lean_lib]]
name = "TomlJson"

# The test suite: its checks (`#guard`, `#eval`) run as it builds, so `lake test` builds it.
[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "tomljson"
root = "Main"
